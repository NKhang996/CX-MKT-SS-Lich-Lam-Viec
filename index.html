<style>

    --bg:#0F1417; --surface:#171E23; --surface-2:#1F2830; --surface-3:#26323C; --border:#2A3540;
    --text:#E8EDF0; --text-dim:#8A97A0; --text-faint:#586570;
    --amber:#E8A33D; --amber-dim:#4A3B22; --teal:#4FB3A9; --teal-dim:#1D3E3A;
    --coral:#E8615D; --coral-dim:#4A2323; --violet:#8B7FD6; --violet-dim:#332E52;
    --pink:#E85d9e; --pink-dim:#4a1e35; --green:#10b981; --green-dim:#164e3d;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  #app{display:flex; min-height:100vh;}

  /* SIDEBAR */
  #sidebar{width:220px; flex:none; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:18px 12px; position:sticky; top:0; height:100vh; z-index:100;}
  .brand{display:flex; align-items:center; gap:9px; padding:4px 8px 20px 8px;}
  .brand-mark{width:28px;height:28px;border-radius:7px; background:linear-gradient(135deg,var(--teal),var(--violet)); flex:none; display:flex;align-items:center;justify-content:center; font-weight:700; font-size:13px; color:#12181f;}
  .brand-text{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; line-height:1.2;}
  .brand-text span{display:block; font-size:10px; font-weight:400; color:var(--text-dim); font-family:'Inter';}
  .navgroup{display:flex; flex-direction:column; gap:3px; margin-top:6px;}
  .navbtn{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; border:none; background:transparent; color:var(--text-dim); font-size:13px; font-weight:500; text-align:left; transition:background .15s, color .15s;}
  .navbtn:hover{background:var(--surface-2); color:var(--text);}
  .navbtn.active{background:var(--surface-3); color:var(--teal);}
  .navbtn .ic{width:16px; text-align:center; flex:none; font-size:13px;}

  /* MAIN */
  #main{flex:1; min-width:0; padding:24px 30px 60px 30px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:20px; flex-wrap:wrap;}
  .topbar h1{font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; margin:0 0 3px 0;}
  .topbar .sub{color:var(--text-dim); font-size:12px;}
  .month-picker{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:6px 8px;}
  .month-picker button{background:var(--surface-2); border:1px solid var(--border); color:var(--text); width:26px;height:26px;border-radius:7px; font-size:13px; display:flex;align-items:center;justify-content:center;}
  .month-picker button:hover{background:var(--surface-3);}
  .month-picker .mval{font-family:'Space Grotesk'; font-weight:700; font-size:14px; min-width:96px; text-align:center;}

  .status-badge{display:inline-flex; align-items:center; gap:6px; font-size:11px; padding:4px 8px; border-radius:20px; background:var(--surface-2); border:1px solid var(--border);}
  .status-dot{width:8px; height:8px; border-radius:50%; background:#e8a33d;}
  .status-dot.online{background:#4ade80;}

  .panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:18px;}
  .panel h2{font-family:'Space Grotesk',sans-serif; font-size:15px; margin:0 0 12px 0; display:flex; align-items:center; gap:8px;}
  
  .info-icon-btn{background:var(--surface-2); border:1px solid var(--border); color:var(--teal); width:20px; height:20px; border-radius:50%; font-size:11px; font-weight:bold; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s;}
  .info-icon-btn:hover{background:var(--teal); color:#000; transform:scale(1.1);}

  .sticky-panel {
    position: sticky;
    top: 10px;
    z-index: 50;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    background: var(--surface);
    border: 1px solid var(--border);

  label.f{display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--text-dim); font-weight:600;}
  label.f input, label.f select{background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:7px; padding:6px 9px; font-size:12.5px;}

  table{border-collapse:separate; border-spacing:0; width:100%;}
  
  .grid-wrap{
    overflow: auto; 
    max-height: 72vh; 
    border-radius:8px; 
    border:1px solid var(--border);
    position: relative;
  }

    font-size:10.5px; 
    text-transform:uppercase; 
    padding:8px 6px; 
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    text-align:left;

  .emp-table td, .cal-table td, .wl-table td, .hol-table td{
    padding:5px 6px; 
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    font-size:12px; 
    vertical-align:middle;
  }
  .emp-table input, .emp-table select, .hol-table input{background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:5px; padding:4px 6px; font-size:11.5px; width:100%;}
  .icon-btn{background:none;border:none;color:var(--text-faint); font-size:13px; padding:3px 5px; border-radius:5px;}
  .icon-btn:hover{color:var(--coral); background:var(--coral-dim);}
  
  .btn-primary{background:var(--teal-dim); color:var(--teal); border:1px solid #235952; padding:7px 12px; border-radius:7px; font-size:12px; font-weight:600; display:inline-flex; gap:6px; align-items:center;}
  .btn-primary:hover{background:#235952;}
  .btn-refresh{background:var(--violet-dim); color:var(--violet); border:1px solid #4c4182; padding:7px 12px; border-radius:7px; font-size:12px; font-weight:600; display:inline-flex; gap:6px; align-items:center;}
  .btn-refresh:hover{background:#4c4182;}
  .btn-excel{background:#1e3a29; color:#4ade80; border:1px solid #166534; padding:7px 12px; border-radius:7px; font-size:12px; font-weight:600; display:inline-flex; gap:6px; align-items:center;}
  .btn-excel:hover{background:#166534;}
  .btn-danger{background:var(--coral-dim); color:var(--coral); border:1px solid #8b2828; padding:7px 12px; border-radius:7px; font-size:12px; font-weight:600; display:inline-flex; gap:6px; align-items:center;}

  .btn-info{background:var(--surface-3); color:var(--amber); border:1px solid var(--amber-dim); padding:6px 10px; border-radius:8px; font-size:12px; font-weight:600; display:inline-flex; gap:6px; align-items:center;}
  .btn-info:hover{background:var(--amber-dim); color:#fff;}

  /* CALENDAR HEADER FIXES */
  .cal-table thead tr th {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface-2);
  }
  .cal-table th.day-header { 
    min-width: 48px; 
    text-align: center; 
    padding: 4px 2px; 
    line-height: 1.2; 
    white-space: nowrap; 
    font-size: 10.5px; 
    font-weight: 600; 
    cursor: pointer; 
  }

  .cal-table td.daycell{ min-width: 48px; height: 34px; text-align: center; padding: 0; cursor: pointer; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 11px; transition: all .1s; }
  .cal-table td.daycell:hover{opacity:0.8; filter:brightness(1.2);}
  .cal-table td.daycell.disabled{background:#171E23 !important; color:#4A5568 !important; cursor:not-allowed; font-weight:400;}

  .cal-table tr:hover td { background-color: rgba(255, 255, 255, 0.05) !important; }
  .cal-table td.col-hover, .cal-table th.col-hover { background-color: rgba(79, 179, 169, 0.12) !important; }
  .cal-table td.cell-active { background-color: rgba(232, 163, 61, 0.3) !important; outline: 2px solid var(--amber); }

  /* STICKY COLUMNS (LEFT) & OVERALL ROW (BOTTOM) */
  .cal-table .sticky-col {
    position: sticky;
    background: var(--surface);
    z-index: 5;
  }
  .cal-table th.sticky-col {
    z-index: 15;
    background: var(--surface-2);
  }
  .cal-table .col-name { left: 0; min-width: 140px; }
  .cal-table .col-region { left: 140px; min-width: 60px; text-align: center; }
  .cal-table .col-team { left: 200px; min-width: 90px; text-align: center; }

  .cal-table tfoot {
    position: sticky;
    bottom: 0;
    z-index: 20;
    background: var(--surface-3);
  }
  .cal-table tfoot td {
    background: var(--surface-3);
    font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
    border-top: 2px solid var(--teal);
  }
  .cal-table tfoot td.sticky-col {
    z-index: 25;

  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; background:var(--surface-2); padding:8px 12px; border-radius:8px; border:1px solid var(--border); align-items:center;}

  .palette-wrap{display:flex; gap:5px; align-items:center; border-left:1px solid var(--border); padding-left:10px; margin-left:5px;}

  .color-dot.active{border-color:#fff; transform:scale(1.25); box-shadow:0 0 8px rgba(255,255,255,0.4);}

  .cal-table th.sun-col{background:#321d22 !important; color:var(--coral) !important; border-bottom:2px solid var(--coral);}

  .cal-table th.spike-payday{background:#2a3b1e !important; color:#4ade80 !important; border-bottom:2px solid #4ade80;}

  .wl-table .rowlabel{text-align:left; position:sticky; left:0; background:var(--surface); z-index:2; min-width:180px; font-weight:600;}
  .wl-table input.override-inp{background:var(--surface-3); border:1px solid var(--border); color:var(--amber); font-weight:700; text-align:center; width:48px; font-size:11px; border-radius:4px; padding:2px;}
  
  /* CẢNH BÁO MÀU */
  .alert-under{background:rgba(232, 97, 93, 0.25) !important; color:#fca5a5 !important; font-weight:700;}
  .alert-over{background:rgba(232, 163, 61, 0.25) !important; color:#fde047 !important; font-weight:700;}
  .alert-ok{background:rgba(79, 179, 169, 0.15) !important; color:#6ee7b7 !important;}

  .kpi-row{display:flex; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
  .kpi{background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px 14px; min-width:140px; flex:1;}
  .kpi .lbl{font-size:10px; color:var(--text-dim); text-transform:uppercase; margin-bottom:3px;}
  .kpi .val{font-family:'Space Grotesk'; font-size:18px; font-weight:700;}

  .tag{padding:2px 6px; border-radius:4px; font-size:10px; font-weight:700; display:inline-block;}
  .tag-lead{background:#3b82f620; color:#60a5fa;}
  .tag-fte{background:#10b98120; color:#34d399;}
  .tag-bpo{background:#f59e0b20; color:#fbbf24;}
  
  .alert-sun{background:var(--coral-dim) !important; color:var(--coral) !important;}
  .ok-sun{color:var(--teal) !important;}

  /* MODAL STYLES */
  .modal-overlay{position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); backdrop-filter:blur(4px); display:none; justify-content:center; align-items:center; z-index:999; padding:20px;}
  .modal-overlay.active{display:flex;}
  .modal-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; max-width:850px; width:100%; max-height:85vh; overflow-y:auto; padding:24px; position:relative; box-shadow:0 10px 30px rgba(0,0,0,0.5);}
  .modal-close{position:absolute; top:18px; right:20px; background:none; border:none; color:var(--text-dim); font-size:20px; cursor:pointer;}
  .modal-close:hover{color:var(--coral);}
  .logic-section{background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:14px;}
  .logic-section h3{margin:0 0 8px 0; color:var(--teal); font-size:14px; font-family:'Space Grotesk'; display:flex; align-items:center; gap:6px;}
  .logic-section p, .logic-section ul{font-size:12.5px; color:var(--text-dim); margin:4px 0; line-height:1.5;}
  .logic-section ul{padding-left:18px;}
</style>

function getTeamStyle(teamName) {
  let hash = 0;
  for (let i = 0; i < teamName.length; i++) {
    hash = teamName.charCodeAt(i) + ((hash << 5) - hash);
  }
  const h = Math.abs(hash) % 360;
  return `border-left: 4px solid hsl(${h}, 70%, 50%) !important; background: hsl(${h}, 30%, 12%);`;
}

function syncStateAndConfig(){
  if(!state.cfg) state.cfg = { ...DEFAULT_CONFIG };
  state.cfg.lastMonthWL = Number(state.cfg.lastMonthWL) || 100000;
  state.cfg.growthRate = Number(state.cfg.growthRate) ?? 10;
  state.cfg.fteTarget = Number(state.cfg.fteTarget) || 750;
  state.cfg.bpoTarget = Number(state.cfg.bpoTarget) || 600;
  state.cfg.claimPct = Number(state.cfg.claimPct) ?? 20;
  state.cfg.sundayWL = Number(state.cfg.sundayWL) || 0;
  state.cfg.underThreshold = Number(state.cfg.underThreshold) || 85;
  state.cfg.overThreshold = Number(state.cfg.overThreshold) || 125;
  state.cfg.doubleDayAdj = Number(state.cfg.doubleDayAdj) || 1.20;
  state.cfg.saleDayAdj = Number(state.cfg.saleDayAdj) || 1.15;
  state.cfg.payDayAdj = Number(state.cfg.payDayAdj) || 1.10;

  if(!state.cfg.dayWeights) state.cfg.dayWeights = { ...DEFAULT_CONFIG.dayWeights };
  if(!state.employees || state.employees.length === 0) state.employees = INITIAL_EMPLOYEES;
  else {
    state.employees.forEach(e => {
      if(!e.id) e.id = uid();
      if(!e.region) e.region = "HCM";
      if(!e.onboarding) e.onboarding = "2024-01-01";
      if(e.offboardDate === undefined) e.offboardDate = "";
      if(e.earlyPass === undefined) e.earlyPass = false;
    });
  }

  if(!state.marks) state.marks = {};
  if(!state.spikeDays) state.spikeDays = {};
  if(!state.overrideWL) state.overrideWL = {};
  if(!state.holidaysFixed) state.holidaysFixed = [];
  if(!state.holidaysDynamic) state.holidaysDynamic = [];
}

function getHolidayInfo(day, m = state.month, y = state.year){
  const mm = String(m).padStart(2, '0');
  const dd = String(day).padStart(2, '0');
  const dateStrShort = `${mm}-${dd}`;
  const dateStrFull = `${y}-${mm}-${dd}`;
  const f = state.holidaysFixed.find(h => h.date === dateStrShort);
  if(f) return f;
  const d = state.holidaysDynamic.find(h => h.date === dateStrFull);
  if(d) return d;
  return null;
}

function monthKey(m = state.month, y = state.year){ return `${y}-${String(m).padStart(2,"0")}`; }
function daysInMonth(m = state.month, y = state.year){ return new Date(y,m,0).getDate(); }
function dateOf(day, m = state.month, y = state.year){ return new Date(y, m-1, day); }

function ensureMonthData(m = state.month, y = state.year){
  const k = monthKey(m, y);
  if(!state.marks[k]) state.marks[k] = {};
  if(!state.spikeDays[k]) state.spikeDays[k] = {};

}

function pushStateToCloud() {

}

function listenCloudChanges() {

function getVisibleEmployeesForCurrentMonth(){
  const monthStart = new Date(state.year, state.month - 1, 1);
  monthStart.setHours(0,0,0,0);
  return state.employees.filter(emp => {
    if(!emp.offboardDate) return true;
    const offb = new Date(emp.offboardDate);
    offb.setHours(0,0,0,0);
    const hideFromMonth = new Date(offb.getFullYear(), offb.getMonth() + 1, 1);
    return monthStart < hideFromMonth;
  });
}

function isEmpActiveOnDate(emp, curDate){
  const cur = new Date(curDate); cur.setHours(0,0,0,0);
  if(emp.onboarding) {
    const onb = new Date(emp.onboarding); onb.setHours(0,0,0,0);
    if(cur < onb) return false;
  }
  if(emp.offboardDate) {
    const offb = new Date(emp.offboardDate); offb.setHours(0,0,0,0);
    if(cur >= offb) return false;
  }
  return true;
}

function isBPOPassedProbation(emp, curDate){
  if(emp.type !== "BPO") return true;
  if(emp.earlyPass) return true;
  if(!emp.onboarding) return false;
  const onb = new Date(emp.onboarding);
  const cur = new Date(curDate);
  return Math.floor((cur - onb) / (1000 * 60 * 60 * 24)) >= 60;
}

function getBPOPerformancePct(emp, currentDate){
  if(!isEmpActiveOnDate(emp, currentDate)) return 0;
  if(emp.type !== "BPO") return 1.0;
  if(isBPOPassedProbation(emp, currentDate)) return 1.0;
  if(!emp.onboarding) return 1.0;
  const onb = new Date(emp.onboarding);
  const cur = new Date(currentDate);
  const diffDays = Math.floor((cur - onb) / (1000 * 60 * 60 * 24));
  if(diffDays < 0) return 0;
  if(diffDays < 7) return 0.20;
  if(diffDays < 14) return 0.50;
  if(diffDays < 21) return 0.75;
  return 1.0;
}

function getCellData(empId, day, m = state.month, y = state.year){
  const mkKey = monthKey(m, y);
  const mData = state.marks[mkKey]?.[empId]?.[day];
  if(!mData) return { status: null, colorBg: null };
  if(typeof mData === 'object') return mData;
  return { status: mData, colorBg: null };
}

function setCellData(empId, day, status, colorBg, skipSave=false){
  const k = monthKey();
  if(!state.marks[k]) state.marks[k] = {};
  if(!state.marks[k][empId]) state.marks[k][empId] = {};

  const current = getCellData(empId, day);
  const newStatus = (status !== undefined) ? status : current.status;
  const newBg = (colorBg !== undefined) ? colorBg : current.colorBg;

  if(!newStatus && !newBg) delete state.marks[k][empId][day];
  else state.marks[k][empId][day] = { status: newStatus, colorBg: newBg };

  if(!skipSave) saveLocalState();
}

function toggleSpikeDay(day){
  const k = monthKey();
  if(!state.spikeDays[k]) state.spikeDays[k] = {};
  const currentVal = state.spikeDays[k][day];
  let currentType = "NONE";
  if(typeof currentVal === "string") currentType = currentVal;
  else if(typeof currentVal === "number" && currentVal > 1.0) currentType = "SALE";

  const nextTypeMap = { "NONE": "SALE", "SALE": "DOUBLE", "DOUBLE": "PAYDAY", "PAYDAY": "NONE" };
  state.spikeDays[k][day] = nextTypeMap[currentType] || "NONE";
  saveLocalState();
  renderAll();
}

function getDaySpikeFactor(day){
  const k = monthKey();
  const dayVal = state.spikeDays[k]?.[day];
  if(!dayVal || dayVal === "NONE") return 1.0;
  if(dayVal === "DOUBLE") return Number(state.cfg.doubleDayAdj) || 1.20;
  if(dayVal === "SALE" || dayVal === 1.15) return Number(state.cfg.saleDayAdj) || 1.15;
  if(dayVal === "PAYDAY") return Number(state.cfg.payDayAdj) || 1.10;
  return 1.0;
}

function setOverrideWL(day, val){
  const k = monthKey();
  if(!state.overrideWL[k]) state.overrideWL[k] = {};
  if(val === "" || val === null || isNaN(val)) delete state.overrideWL[k][day];
  else state.overrideWL[k][day] = Number(val);
  saveLocalState();
  renderAll();
}

function countSundayDutyInMonth(empId, m, y){
  const k = monthKey(m, y);
  const n = daysInMonth(m, y);
  let count = 0;
  const emp = state.employees.find(e => e.id === empId);
  if(!emp) return 0;

  for(let d=1; d<=n; d++){
    const curD = dateOf(d, m, y);
    if(curD.getDay() === 0){
      const cell = getCellData(empId, d, m, y);
      const isWorking = (cell.status === "S2" || cell.status === "OT" || cell.status === "WFH" || (!cell.status && isEmpActiveOnDate(emp, curD)));
      if(isWorking && isEmpActiveOnDate(emp, curD)) count++;
    }
  }
  return count;
}

function calculateMonthlyForecast(){
  syncStateAndConfig();
  const n = daysInMonth(state.month, state.year);
  const totalWL = Math.round(state.cfg.lastMonthWL * (1 + state.cfg.growthRate / 100));
  const mkKey = monthKey();
  const visibleEmps = getVisibleEmployeesForCurrentMonth();
  
  let totalWeight = 0;
  for(let d=1; d<=n; d++){
    const wd = dateOf(d).getDay();
    const spike = getDaySpikeFactor(d);
    const w = state.cfg.dayWeights[wd] !== undefined ? Number(state.cfg.dayWeights[wd]) : 1.0;
    totalWeight += w * spike;
  }

  let dailyForecast = [];
  for(let d=1; d<=n; d++){
    const curDate = dateOf(d);
    const wd = curDate.getDay();
    const isSun = (wd === 0);
    const spike = getDaySpikeFactor(d);

    let dayTotalWL = 0;
    if(state.overrideWL[mkKey]?.[d] !== undefined){
      dayTotalWL = Number(state.overrideWL[mkKey][d]);
    } else if(isSun && state.cfg.sundayWL > 0){
      dayTotalWL = Number(state.cfg.sundayWL);
    } else {
      const w = state.cfg.dayWeights[wd] !== undefined ? Number(state.cfg.dayWeights[wd]) : 1.0;
      const dayWeight = w * spike;
      dayTotalWL = Math.round((totalWL / (totalWeight || 1)) * dayWeight);
    }

    const claimWL = Math.round(dayTotalWL * (state.cfg.claimPct / 100));
    const supportWL = dayTotalWL - claimWL;

    let fteCapacity = 0, bpoCapacity = 0;
    let totalWorkingHC = 0;
    
    visibleEmps.forEach(e => {
      if(!isEmpActiveOnDate(e, curDate)) return;
      const cell = getCellData(e.id, d);
      const mk = cell.status;
      const isWorking = (mk === "S2" || mk === "OT" || mk === "WFH" || !mk);

      if(isWorking){
        totalWorkingHC++;
        if(e.type === "FTE") fteCapacity += state.cfg.fteTarget;
        else {
          const rampPct = getBPOPerformancePct(e, curDate);
          bpoCapacity += state.cfg.bpoTarget * rampPct;
        }
      }
    });

    const totalCapacity = fteCapacity + bpoCapacity;
    const overallCoverage = dayTotalWL > 0 ? (totalCapacity / dayTotalWL) * 100 : 100;
    const netGapWL = totalCapacity - dayTotalWL;
    const hcGap = state.cfg.fteTarget > 0 ? (netGapWL / state.cfg.fteTarget).toFixed(1) : 0;

    dailyForecast.push({
      day: d, weekday: VN_SHORT_WEEKDAY[wd], dayTotalWL, claimWL, supportWL,
      fteCapacity, bpoCapacity, totalCapacity,
      netGapWL, hcGap, overallCoverage, totalWorkingHC,
      spikeFactor: spike, isOverride: state.overrideWL[mkKey]?.[d] !== undefined
    });
  }
  return { totalWL, dailyForecast };
}

  }

  let dailyWorkingHC = Array(n + 1).fill(0);
  let dailySundayFTE = Array(n + 1).fill(0);

  const rows = visibleEmps.map(e=>{
    let counts = { AL_SL:0, OFF:0, CN_Working:0, WFH:0, OFF_T7:0 };
    let dayCells = "";

    }

    const tagClass = e.role === "Leader" ? "tag-lead" : (e.type==="FTE"?"tag-fte":"tag-bpo");
    const dynamicTeamStyle = getTeamStyle(e.team);

    let sundayMultiMonthCells = "";

      sundayMultiMonthCells += `<td style="text-align:center; font-weight:700;" class="mono">${cnt}</td>`;
    });

    let warnBadge = has3ConsecutiveOff ? `<span title="⚠️ Nhân sự nghỉ 3 ngày liên tiếp!" style="color:var(--coral); cursor:help;">⚠️</span>` : '';

    let meta = `<td class="sticky-col col-name" style="font-weight:600">${warnBadge} ${e.name} ${e.offboardDate ? '<span style="color:var(--coral); font-size:10px;">(Offboard)</span>':''}</td>

                <td style="text-align:center" class="mono">${counts.OFF_T7}</td>`;

    return `<tr>${meta}${dayCells}</tr>`;
  }).join("");

  let overallCells = "";
  for(let d=1; d<=n; d++){

    overallCells += `<td style="text-align:center; font-size:10.5px" class="${alertClass} col-idx-${d}">${cellVal}</td>`;

  const numMCols = mList.length;

    <td class="sticky-col col-region"></td>

    ${overallCells}

  return `

function bindCrosshairEvents(){
  const table = document.getElementById("calendarTable");
  if(!table) return;

  table.addEventListener("mouseover", (e) => {
    const td = e.target.closest("td, th");
    if (!td) return;
    
    table.querySelectorAll(".col-hover, .cell-active").forEach(el => el.classList.remove("col-hover", "cell-active"));

    const colClass = Array.from(td.classList).find(c => c.startsWith("col-idx-"));
    if (colClass) table.querySelectorAll("." + colClass).forEach(el => el.classList.add("col-hover"));
    if(td.tagName === 'TD' && td.classList.contains('daycell')) td.classList.add("cell-active");
  });

  table.addEventListener("mouseleave", () => {
    table.querySelectorAll(".col-hover, .cell-active").forEach(el => el.classList.remove("col-hover", "cell-active"));
  });
}

function handleCellClick(empId, day){
  const emp = state.employees.find(e => e.id === empId);
  if(!isEmpActiveOnDate(emp, dateOf(day))) return;

  if(activeColor !== null){
    if(activeColor === 'REMOVE') setCellData(empId, day, undefined, null);
    else setCellData(empId, day, undefined, activeColor);
  } else {
    const statusVal = activeTool === '(Xóa)' ? null : activeTool;
    setCellData(empId, day, statusVal, undefined);
  }
  renderAll();
}

function renderForecast(){
  const { totalWL, dailyForecast } = calculateMonthlyForecast();
  const n = daysInMonth(state.month, state.year);

  let head = `<tr><th class="rowlabel">Chỉ số / Ngày</th>`;
  let rHC = `<tr><td class="rowlabel" style="color:var(--teal)">Overall HC Đi Làm</td>`;
  let rTotal = `<tr><td class="rowlabel">Workload Dự kiến (Daily WL)</td>`;
  let rOverride = `<tr><td class="rowlabel" style="color:var(--amber)">✏️ Override Workload (Thủ công)</td>`;
  let rClaim = `<tr><td class="rowlabel">Workload Claim (Khiếu nại)</td>`;
  let rSupp = `<tr><td class="rowlabel">Workload Support (Hỗ trợ)</td>`;
  let rCapTotal = `<tr><td class="rowlabel" style="font-weight:700">Tổng Năng Lực Team (Total Cap)</td>`;
  let rGapWL = `<tr><td class="rowlabel" style="font-weight:700">Dư/Thiếu WL (Net Case Gap)</td>`;
  let rGapHC = `<tr><td class="rowlabel">Thừa/Thiếu HC Quy Đổi</td>`;
  let rOverallCov = `<tr><td class="rowlabel" style="font-weight:700">⭐ SLA Coverage Tổng thể (%)</td>`;

  dailyForecast.forEach(f => {
    let dayStr = String(f.day).padStart(2, '0');
    let alertClass = "alert-ok";
    if(f.overallCoverage < state.cfg.underThreshold) alertClass = "alert-under";
    else if(f.overallCoverage > state.cfg.overThreshold) alertClass = "alert-over";

    let spikeTag = f.spikeFactor > 1.15 ? '🔥🔥' : (f.spikeFactor > 1.0 ? '🔥' : '');

    head += `<th class="${alertClass}">${dayStr}<br><span style="font-size:9px;">${f.weekday}</span>${spikeTag}</th>`;
    rHC += `<td class="mono ${alertClass}" style="font-weight:700">${f.totalWorkingHC}</td>`;
    rTotal += `<td class="mono">${f.dayTotalWL.toLocaleString()}</td>`;
    
    const overrideVal = state.overrideWL[monthKey()]?.[f.day] ?? '';
    rOverride += `<td><input class="override-inp mono" type="number" placeholder="—" value="${overrideVal}" onchange="setOverrideWL(${f.day}, this.value)"></td>`;

    rClaim += `<td class="mono" style="color:var(--teal)">${f.claimWL}</td>`;
    rSupp += `<td class="mono" style="color:var(--amber)">${f.supportWL}</td>`;
    rCapTotal += `<td class="mono" style="font-weight:700; color:var(--teal)">${Math.round(f.totalCapacity)}</td>`;

    rGapWL += `<td class="mono" style="font-weight:700; color:${f.netGapWL<0?'var(--coral)':'var(--teal)'}">${f.netGapWL>0?'+':''}${Math.round(f.netGapWL)}</td>`;
    rGapHC += `<td class="mono" style="color:${f.hcGap<0?'var(--coral)':'var(--teal)'}">${f.hcGap>0?'+':''}${f.hcGap} HC</td>`;
    rOverallCov += `<td class="mono ${alertClass}" style="font-weight:700">${Math.round(f.overallCoverage)}%</td>`;
  });

  head += `</tr>`; rHC += `</tr>`; rTotal += `</tr>`; rOverride += `</tr>`; rClaim += `</tr>`; rSupp += `</tr>`;
  rCapTotal += `</tr>`; rGapWL += `</tr>`; rGapHC += `</tr>`; rOverallCov += `</tr>`;

  return `
  <div class="panel">
    <h2>⚙ Tham số Forecast Workload & Ngưỡng Cảnh báo SLA <button class="info-icon-btn" onclick="openTopicLogic('forecast_cfg')" title="Xem công thức">i</button></h2>
    <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:center;">
      <label class="f">Workload Tháng Trước<input type="number" id="cfg-lastWL" value="${state.cfg.lastMonthWL}"></label>
      <label class="f">Tỷ lệ Tăng trưởng (%)<input type="number" id="cfg-growth" value="${state.cfg.growthRate}"></label>
      <label class="f">Target FTE (case/ngày)<input type="number" id="cfg-fteT" value="${state.cfg.fteTarget}"></label>
      <label class="f">Target BPO (case/ngày)<input type="number" id="cfg-bpoT" value="${state.cfg.bpoTarget}"></label>
      <label class="f">% Ticket Khiếu nại<input type="number" id="cfg-claimPct" value="${state.cfg.claimPct}"></label>
      <label class="f">Ghi đè Workload CN<input type="number" id="cfg-sunWL" placeholder="Tự động" value="${state.cfg.sundayWL || ''}"></label>
      <label class="f" style="color:var(--coral)">Ngưỡng Thiếu (Alert Đỏ)<input type="number" id="cfg-underTh" value="${state.cfg.underThreshold}"></label>
      <label class="f" style="color:var(--amber)">Ngưỡng Thừa (Alert Vàng)<input type="number" id="cfg-overTh" value="${state.cfg.overThreshold}"></label>
    </div>
  </div>

  <div class="panel">
    <h2>📈 Tổng Quan Workload Tháng ${state.month}/${state.year} <button class="info-icon-btn" onclick="openTopicLogic('forecast_kpi')" title="Xem công thức">i</button></h2>
    <div class="kpi-row">
      <div class="kpi"><div class="lbl">TỔNG WORKLOAD DỰ KIẾN</div><div class="val" style="color:var(--amber)">${totalWL.toLocaleString()} case</div></div>
      <div class="kpi"><div class="lbl">WORKLOAD TRUNG BÌNH/NGÀY</div><div class="val" style="color:var(--teal)">${Math.round(totalWL/n).toLocaleString()} case</div></div>

function copyToClipboardGSheet(){
  const n = daysInMonth(state.month, state.year);
  const visibleEmps = getVisibleEmployeesForCurrentMonth();
  let tsv = "";

  let rHeader = ["Name","Region","Team","Role","CN M-3","CN M-2","CN M-1","CN M+1","AL/SL","OFF DAY","CN THÁNG NÀY","WFH","OFF T7"];
  for(let d=1; d<=n; d++) {
    let dayStr = String(d).padStart(2, '0');
    let monthStr = String(state.month).padStart(2, '0');
    tsv += `${VN_SHORT_WEEKDAY[dateOf(d).getDay()]} ${dayStr}/${monthStr}\t`;
  }
  tsv += rHeader.join("\t") + "\n";

  const mList = [
    { m: state.month-3 < 1 ? state.month+9 : state.month-3, y: state.month-3 < 1 ? state.year-1 : state.year },
    { m: state.month-2 < 1 ? state.month+10 : state.month-2, y: state.month-2 < 1 ? state.year-1 : state.year },
    { m: state.month-1 < 1 ? state.month+11 : state.month-1, y: state.month-1 < 1 ? state.year-1 : state.year },
    { m: state.month+1 > 12 ? state.month-11 : state.month+1, y: state.month+1 > 12 ? state.year+1 : state.year }
  ];

  visibleEmps.forEach(e => {
    let counts = { AL_SL:0, OFF:0, CN_Working:0, WFH:0, OFF_T7:0 };
    let daysData = [];

    for(let d=1; d<=n; d++){
      const curDate = dateOf(d);
      if(!isEmpActiveOnDate(e, curDate)){
        daysData.push("-");
        continue;
      }

      const cell = getCellData(e.id, d);
      const mk = cell.status || "";
      const wd = curDate.getDay();
      const isWorking = (mk === "S2" || mk === "OT" || mk === "WFH" || !mk);

      if(isWorking && wd === 0) counts.CN_Working++;
      if(mk === "AL" || mk === "AL1/2" || mk === "SL") counts.AL_SL += (mk==="AL"||mk==="SL"?1:0.5);
      if(mk === "OFF" || mk === "OFF/2") {
        counts.OFF += (mk==="OFF"?1:0.5);
        if(wd===6) counts.OFF_T7++;
      }
      if(mk === "WFH") counts.WFH++;
      daysData.push(mk);
    }

    let prevSunCounts = mList.map(item => countSundayDutyInMonth(e.id, item.m, item.y));
    let row = [ e.name, e.region||'HCM', e.team, e.role, ...prevSunCounts, counts.AL_SL, counts.OFF, counts.CN_Working, counts.WFH, counts.OFF_T7, ...daysData ];
    tsv += row.join("\t") + "\n";
  });

  navigator.clipboard.writeText(tsv).then(() => {
    alert("✅ Đã sao chép lịch trực vào Clipboard!\nBạn mở Google Sheet và nhấn Ctrl + V để dán.");
  }).catch(err => { alert("Lỗi khi copy: " + err); });
}

function checkConsecutiveOffThreshold(empId, day, totalDaysInMonth) {
  let isNotWorking = (d) => {
    if (d < 1 || d > totalDaysInMonth) return false;
    let st = getCellData(empId, d).status;
    return st === "OFF" || st === "AL" || st === "SL" || st === "HOL" || st === "OFF/2";
  };

  let left = 0;
  for (let d = day - 1; d >= 1; d--) {
    if (isNotWorking(d)) left++; else break;
  }
  let right = 0;
  for (let d = day + 1; d <= totalDaysInMonth; d++) {
    if (isNotWorking(d)) right++; else break;
  }
  return (left + 1 + right);
}

function clearMonthSchedule(){
  const k = monthKey();
  if(!confirm(`⚠️ Bạn có chắc muốn XÓA TRỐNG toàn bộ lịch xếp của Tháng ${state.month}/${state.year} không?`)) return;
  if(state.marks && state.marks[k]) delete state.marks[k];
  saveLocalState();
  renderAll();
  alert(`✅ Đã xóa sạch lịch trực Tháng ${state.month}/${state.year} về trống!`);
}

// 🎯 SMART AUTO-FILL VỚI LOGIC LEADER NGHĨ T7 & CÁC TEAM ĐỘNG
function autoFillSmart(){
  const n = daysInMonth(state.month, state.year);
  const { dailyForecast } = calculateMonthlyForecast();
  const visibleEmps = getVisibleEmployeesForCurrentMonth();

  visibleEmps.forEach(e => {
    for(let d=1; d<=n; d++){
      if(!isEmpActiveOnDate(e, dateOf(d))) continue;
      let cell = getCellData(e.id, d);
      if(cell.status === "OFF" || cell.status === "S2" || cell.status === "HOL") {
        setCellData(e.id, d, null, undefined, true);
      }
    }
  });

  // 0. AUTO FILL NGÀY LỄ (HOL)
  for(let d=1; d<=n; d++){
    let holInfo = getHolidayInfo(d);
    if(holInfo){
      visibleEmps.forEach(e => {
        if(isEmpActiveOnDate(e, dateOf(d))) setCellData(e.id, d, "HOL", undefined, true);
      });
    }
  }

  // 1. Chia ca Chủ Nhật (Leader & SubLead auto OFF)
  let currentMonthSunCount = {};
  visibleEmps.forEach(e => currentMonthSunCount[e.id] = 0);

  let sundays = [];
  for(let d=1; d<=n; d++) if(dateOf(d).getDay() === 0) sundays.push(d);

  const teamList = [...new Set(visibleEmps.map(e => e.team))];

  sundays.forEach(d => {
    teamList.forEach(teamName => {
      let teamEmps = visibleEmps.filter(e => {
        if(!isEmpActiveOnDate(e, dateOf(d))) return false;
        if(e.team !== teamName) return false;
        if(e.role === "Leader" || e.role === "SubLead") return false; 
        if(e.type === "BPO" && !isBPOPassedProbation(e, dateOf(d))) return false; 
        return true;
      });

      teamEmps.sort((a, b) => {
        let prevA = countSundayDutyInMonth(a.id, state.month-1, state.year) + countSundayDutyInMonth(a.id, state.month-2, state.year);
        let prevB = countSundayDutyInMonth(b.id, state.month-1, state.year) + countSundayDutyInMonth(b.id, state.month-2, state.year);
        let totalA = prevA + currentMonthSunCount[a.id];
        let totalB = prevB + currentMonthSunCount[b.id];
        if (totalA !== totalB) return totalA - totalB;
        return Math.random() - 0.5;
      });

      let assigned = 0;
      teamEmps.forEach(e => {
        let cell = getCellData(e.id, d);
        if(cell.status) return;

        if(assigned < 2) {
          setCellData(e.id, d, "S2", undefined, true);
          currentMonthSunCount[e.id]++;
          assigned++;
        } else {
          setCellData(e.id, d, "OFF", undefined, true);
        }
      });
    });

    visibleEmps.forEach(e => {
      if(dateOf(d).getDay() === 0 && isEmpActiveOnDate(e, dateOf(d))) {
        if(e.role === "Leader" || e.role === "SubLead" || (e.type === "BPO" && !isBPOPassedProbation(e, dateOf(d)))) {
          let cell = getCellData(e.id, d);
          if(!cell.status) setCellData(e.id, d, "OFF", undefined, true);
        }
      }
    });
  });

  // 2. Chia ca OFF Ngày Thường (Ưu tiên Thứ 7 cho Leader)
  let dailyTeamOffCount = {}; 
  visibleEmps.forEach(e => {
    let passed = isBPOPassedProbation(e, dateOf(1));
    let baseTargetOff = (e.type === "FTE" || passed) ? state.cfg.offFTE : state.cfg.offBPO;
    
    let activeDaysInMonth = 0;
    for(let d=1; d<=n; d++) if(isEmpActiveOnDate(e, dateOf(d))) activeDaysInMonth++;
    let targetOff = Math.round(baseTargetOff * (activeDaysInMonth / n));

    let currentOff = 0;
    for(let d=1; d<=n; d++){
      if(!isEmpActiveOnDate(e, dateOf(d))) continue;
      let cell = getCellData(e.id, d);
      if(cell.status === "OFF") currentOff++;
    }

    let neededOff = Math.max(0, targetOff - currentOff);

    let candidateDays = [];
    for(let d=1; d<=n; d++){
      if(!isEmpActiveOnDate(e, dateOf(d))) continue;
      if(dateOf(d).getDay() === 0) continue; 

      let cell = getCellData(e.id, d);
      const isSpike = dailyForecast[d-1].spikeFactor > 1.0;

      if(!cell.status && !isSpike) {
        let consStreak = checkConsecutiveOffThreshold(e.id, d, n);
        candidateDays.push({
          day: d,
          consStreak: consStreak,
          wl: dailyForecast[d-1].dayTotalWL
        });
      }
    }

    if(candidateDays.length > 0) {
      if (e.role === "Leader") {
        let candidateSaturdays = candidateDays.filter(c => dateOf(c.day).getDay() === 6);
        candidateSaturdays.sort(() => Math.random() - 0.5);
        
        while (neededOff > 0 && candidateSaturdays.length > 0) {
          let selectedSat = candidateSaturdays.pop();
          setCellData(e.id, selectedSat.day, "OFF", undefined, true);
          neededOff--;
          candidateDays = candidateDays.filter(c => c.day !== selectedSat.day);
        }
      }

      candidateDays.sort((a, b) => {
        if (a.consStreak !== b.consStreak) return a.consStreak - b.consStreak;
        return a.wl - b.wl; 
      });

      for (let i = 0; i < neededOff; i++) {
        if (candidateDays.length > 0) {
          let selectedDay = candidateDays.shift().day;
          setCellData(e.id, selectedDay, "OFF", undefined, true);
        }
      }
    }

    for(let d=1; d<=n; d++){
      if(!isEmpActiveOnDate(e, dateOf(d))) continue;
      let cell = getCellData(e.id, d);
      if(!cell.status) setCellData(e.id, d, "S2", undefined, true);
    }
  });

  saveLocalState();
  renderAll();
  alert(`✨ Đã tự động xếp lịch xong cho Tháng ${state.month}/${state.year}! (Leader được nghỉ 100% Chủ Nhật & ưu tiên Thứ 7).`);
}

function renderAllUIOnly(){
  ensureMonthData(); renderNav(); renderTopbar();
  const el = document.getElementById("content");
  if(tab==="forecast") el.innerHTML = renderForecast();
  else if(tab==="lich") {
    el.innerHTML = renderLich();
    bindCrosshairEvents();
  }
  else if(tab==="nhansu") el.innerHTML = renderNhanSu();
  else if(tab==="cauhinh") el.innerHTML = renderCauHinh();

  // BẮT SỰ KIỆN LƯU THÔNG SỐ CONFIG THƯỜNG
  document.querySelectorAll('input[id^="cfg-"]').forEach(i => i.onchange = (e) => { 
    const key = i.id.replace("cfg-","");
    const mapKey = { lastWL:'lastMonthWL', growth:'growthRate', fteT:'fteTarget', bpoT:'bpoTarget', offFTE:'offFTE', offBPO:'offBPO', maxSun:'maxSundayHC', claimPct:'claimPct', sunWL:'sundayWL', underTh:'underThreshold', overTh:'overThreshold', doubleDay:'doubleDayAdj', saleDay:'saleDayAdj', payDay:'payDayAdj' };
    if(mapKey[key]) state.cfg[mapKey[key]] = Number(e.target.value);
    saveLocalState();
    renderAll();
  });

  // 🛠 BẮT SỰ KIỆN LƯU BẢNG DAY WEIGHT (dw-0 -> dw-6)
  document.querySelectorAll('input[id^="dw-"]').forEach(i => i.onchange = (e) => {
    const dayIndex = Number(i.id.replace("dw-", ""));
    if(!state.cfg.dayWeights) state.cfg.dayWeights = {};
    state.cfg.dayWeights[dayIndex] = Number(e.target.value);
    saveLocalState();
    renderAll();
  });

  document.querySelectorAll('tr[data-emp] [data-f]').forEach(i => i.onchange = (e) => { 
      const emp = state.employees.find(em => em.id === i.closest('tr').dataset.emp);
      const field = i.dataset.f;
      let val = (i.type === 'checkbox') ? i.checked : e.target.value;
      emp[field] = val;
      saveLocalState();
      renderAll();
  });

  document.querySelectorAll('tr[data-hol-f] [data-hf]').forEach(i => i.onchange = (e) => {
      const hId = i.closest('tr').dataset.holF;
      const item = state.holidaysFixed.find(h => h.id === hId);
      if(item) { item[i.dataset.hf] = e.target.value; saveLocalState(); }
  });

  document.querySelectorAll('tr[data-hol-d] [data-hd]').forEach(i => i.onchange = (e) => {
      const hId = i.closest('tr').dataset.holD;
      const item = state.holidaysDynamic.find(h => h.id === hId);
      if(item) { 
        let field = i.dataset.hd;
        item[field] = field === 'year' ? Number(e.target.value) : e.target.value; 
        saveLocalState(); 
      }
  });

  document.querySelectorAll('[data-del]').forEach(b => b.onclick = (e) => {
    if(confirm("Bạn có chắc chắn muốn xóa hẳn nhân viên này khỏi hệ thống?")) {
      state.employees = state.employees.filter(em => em.id !== e.target.dataset.del);
      saveLocalState();
      renderAll();
    }
  });
}

function renderAll(){
  const container = document.getElementById("calendarTableContainer");
  let scrollTop = 0;
  let scrollLeft = 0;
  
  if (container) {
    scrollTop = container.scrollTop;
    scrollLeft = container.scrollLeft;
  }

  renderAllUIOnly();

  const newContainer = document.getElementById("calendarTableContainer");
  if (newContainer) {
    newContainer.scrollTop = scrollTop;
    newContainer.scrollLeft = scrollLeft;
  }
}

document.getElementById("prevMonth").onclick = () => { state.month = state.month===1?12:state.month-1; if(state.month===12) state.year--; renderAll(); };
document.getElementById("nextMonth").onclick = () => { state.month = state.month===12?1:state.month+1; if(state.month===1) state.year++; renderAll(); };

loadLocalState();
renderAll();
listenCloudChanges();
</script>
